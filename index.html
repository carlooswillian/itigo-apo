<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ItiGo App - Roteiro de Viagem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .bg-glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-plane-departure text-2xl text-amber-300"></i>
        <h1 class="text-2xl font-bold tracking-wide">ItiGo <span class="text-amber-300">App</span></h1>
      </div>
      <button onclick="openAdminModal()" class="bg-indigo-700 hover:bg-indigo-800 text-white text-sm px-3 py-2 rounded-lg flex items-center gap-2 border border-indigo-500 transition">
        <i class="fa-solid fa-lock text-amber-300"></i>
        <span class="hidden sm:inline">Painel Admin</span>
      </button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-4xl mx-auto px-4 mt-6">
    
    <!-- Filtro / Seletor de Viagem -->
    <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <h2 id="tripTitle" class="text-xl font-bold text-slate-800">Carregando roteiro...</h2>
        <p class="text-xs text-slate-500">Visualização em tempo real</p>
      </div>
      <div id="financialSummary" class="flex gap-4 text-sm font-semibold">
        <div class="text-slate-600">Estimado: <span id="totalEstimado" class="text-indigo-600">R$ 0,00</span></div>
        <div class="text-slate-600">Pago: <span id="totalPago" class="text-emerald-600">R$ 0,00</span></div>
      </div>
    </div>

    <!-- Timeline do Roteiro -->
    <div id="waypointsList" class="space-y-4">
      <!-- Inserido dinamicamente via JavaScript -->
    </div>
  </main>

  <!-- Modal Admin / Inserção & Edição (Protegido por PIN) -->
  <div id="adminModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 relative">
      
      <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>

      <!-- Step 1: Validação de PIN -->
      <div id="pinStep" class="text-center py-6">
        <i class="fa-solid fa-shield-halved text-4xl text-indigo-600 mb-3"></i>
        <h3 class="text-lg font-bold text-slate-800 mb-1">Acesso do Administrador</h3>
        <p class="text-xs text-slate-500 mb-4">Digite o PIN para gerenciar o roteiro</p>
        
        <input type="password" id="pinInput" placeholder="PIN de 4 dígitos" maxlength="4" class="text-center tracking-widest text-xl border border-slate-300 rounded-lg p-2 w-40 mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        
        <div>
          <button onclick="verifyPin()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-6 py-2 rounded-lg transition w-40">Acessar</button>
        </div>
      </div>

      <!-- Step 2: Formulário Inteligente de Waypoint -->
      <div id="formStep" class="hidden">
        <h3 id="modalFormTitle" class="text-lg font-bold text-slate-800 mb-4">Adicionar Novo Ponto</h3>
        
        <form id="waypointForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
          <input type="hidden" id="wpId">
          <input type="hidden" id="wpTripId" value="capitolio_2026">

          <!-- Busca Inteligente de Local -->
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nome do Local / Atividade</label>
            <div class="flex gap-2">
              <input type="text" id="wpAtividade" required placeholder="Ex: Parque da Capivara" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
              <button type="button" onclick="searchLocation()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 py-2 rounded-lg flex items-center gap-1 transition" title="Buscar Link e Foto">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Auto
              </button>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Data e Hora</label>
              <input type="datetime-local" id="wpDataHora" required class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Valor Estimado (R$)</label>
              <input type="number" step="0.01" id="wpValorEstimado" placeholder="0.00" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Valor Pago (R$)</label>
              <input type="number" step="0.01" id="wpValorPago" placeholder="0.00" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div class="flex items-center pt-5">
              <label class="inline-flex items-center cursor-pointer">
                <input type="checkbox" id="wpPago" class="sr-only peer">
                <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
                <span class="ml-2 text-xs font-medium text-slate-700">Pago?</span>
              </label>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Link do Google Maps / Waze</label>
            <input type="url" id="wpMapaUrl" placeholder="https://maps.google.com/..." class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">URL da Imagem de Referência</label>
            <input type="url" id="wpImagemUrl" placeholder="https://images.unsplash.com/..." class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Observações</label>
            <textarea id="wpObservacoes" rows="2" placeholder="Dicas, horários de funcionamento, etc." class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
          </div>

          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeAdminModal()" class="px-4 py-2 border border-slate-300 text-slate-600 text-sm rounded-lg hover:bg-slate-50">Cancelar</button>
            <button type="submit" id="btnSave" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg transition">Salvar Ponto</button>
          </div>
        </form>
      </div>

    </div>
  </div>

  <script>
    // URL do seu Google Apps Script (Backend)
    const API_URL = "https://script.google.com/macros/s/AKfycbyvlltkuspMMfkpbSbHXujbKBYKVJ-AMSSBURae5RUP0qaLmvM97N2LJg5xdynfdKS1/exec";
    
    let currentPin = "";
    let waypointsData = [];

    // Inicialização
    document.addEventListener("DOMContentLoaded", () => {
      loadWaypoints();
    });

    // Carregar dados da API
    async function loadWaypoints() {
      try {
        const response = await fetch(`${API_URL}?action=getWaypoints&trip_id=capitolio_2026`);
        waypointsData = await response.json();
        
        document.getElementById("tripTitle").innerText = "Capitólio - MG (Roteiro Completo)";
        renderWaypoints(waypointsData);
        calculateFinancials(waypointsData);
      } catch (err) {
        console.error("Erro ao carregar roteiro:", err);
        document.getElementById("waypointsList").innerHTML = `<div class="text-center py-8 text-red-500">Erro ao carregar dados do Google Sheets.</div>`;
      }
    }

    // Renderizar Lista na Tela
    function renderWaypoints(items) {
      const container = document.getElementById("waypointsList");
      if (!items || items.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-400">Nenhum ponto cadastrado ainda.</div>`;
        return;
      }

      container.innerHTML = items.map(wp => {
        const dataFormatada = wp.data_hora ? new Date(wp.data_hora).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : 'A definir';
        const isPago = wp.pago === "Sim";

        return `
          <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden flex flex-col sm:flex-row hover:shadow-md transition">
            ${wp.imagem_url ? `
              <div class="sm:w-1/3 h-48 sm:h-auto bg-cover bg-center" style="background-image: url('${wp.imagem_url}')"></div>
            ` : ''}
            
            <div class="p-4 flex-1 flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-start">
                  <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded-md mb-2 inline-block">
                    <i class="fa-regular fa-clock mr-1"></i>${dataFormatada}
                  </span>
                  ${currentPin ? `
                    <button onclick="editWaypoint('${wp.id}')" class="text-slate-400 hover:text-indigo-600 text-xs px-2 py-1">
                      <i class="fa-solid fa-pen-to-square text-sm"></i> Editar
                    </button>
                  ` : ''}
                </div>

                <h3 class="text-lg font-bold text-slate-800">${wp.atividade_local}</h3>
                ${wp.observacoes ? `<p class="text-xs text-slate-500 mt-1">${wp.observacoes}</p>` : ''}
              </div>

              <div class="mt-4 pt-3 border-t border-slate-100 flex flex-wrap justify-between items-center gap-2">
                <div class="text-xs space-x-2">
                  <span class="text-slate-500">Est: <strong class="text-slate-700">R$ ${parseFloat(wp.valor_estimado || 0).toFixed(2)}</strong></span>
                  <span class="text-slate-500">Pago: <strong class="${isPago ? 'text-emerald-600' : 'text-slate-700'}">R$ ${parseFloat(wp.valor_pago || 0).toFixed(2)}</strong></span>
                </div>

                <div class="flex gap-2">
                  ${wp.mapa_url ? `
                    <a href="${wp.mapa_url}" target="_blank" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1 transition">
                      <i class="fa-solid fa-location-dot"></i> Maps / Waze
                    </a>
                  ` : ''}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Cálculos Financeiros
    function calculateFinancials(items) {
      let totalEst = 0;
      let totalPag = 0;

      items.forEach(i => {
        totalEst += parseFloat(i.valor_estimado || 0);
        totalPag += parseFloat(i.valor_pago || 0);
      });

      document.getElementById("totalEstimado").innerText = `R$ ${totalEst.toFixed(2)}`;
      document.getElementById("totalPago").innerText = `R$ ${totalPag.toFixed(2)}`;
    }

    // Modal Admin
    function openAdminModal() {
      document.getElementById("adminModal").classList.remove("hidden");
    }

    function closeAdminModal() {
      document.getElementById("adminModal").classList.add("hidden");
    }

    // Verificar PIN
    function verifyPin() {
      const input = document.getElementById("pinInput").value;
      if (input === "1304") {
        currentPin = input;
        document.getElementById("pinStep").classList.add("hidden");
        document.getElementById("formStep").classList.remove("hidden");
        renderWaypoints(waypointsData); // Atualiza com botões de editar visíveis
      } else {
        alert("PIN incorreto!");
      }
    }

    // Busca Automática de Endereço e Foto (Recurso Inteligente sem APIs Pagas)
    async function searchLocation() {
      const local = document.getElementById("wpAtividade").value;
      if (!local) return alert("Digite o nome do local primeiro.");

      // Generates Maps/Waze redirect Link
      const mapsQuery = encodeURIComponent(local + " Capitólio MG");
      document.getElementById("wpMapaUrl").value = `https://www.google.com/maps/search/?api=1&query=${mapsQuery}`;

      // Generates Image from Unsplash Source (Gratuito)
      const imageQuery = encodeURIComponent(local);
      document.getElementById("wpImagemUrl").value = `https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80`; 
      
      alert("Localização e link de mapa preenchidos automaticamente!");
    }

    // Submeter Formulário
    async function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSave");
      btn.innerText = "Salvando...";
      btn.disabled = true;

      const payload = {
        pin: currentPin,
        action: "saveWaypoint",
        waypoint: {
          id: document.getElementById("wpId").value,
          trip_id: document.getElementById("wpTripId").value,
          atividade_local: document.getElementById("wpAtividade").value,
          data_hora: document.getElementById("wpDataHora").value,
          valor_estimado: document.getElementById("wpValorEstimado").value,
          valor_pago: document.getElementById("wpValorPago").value,
          pago: document.getElementById("wpPago").checked,
          mapa_url: document.getElementById("wpMapaUrl").value,
          imagem_url: document.getElementById("wpImagemUrl").value,
          observacoes: document.getElementById("wpObservacoes").value
        }
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
          alert("Ponto salvo com sucesso!");
          document.getElementById("waypointForm").reset();
          document.getElementById("wpId").value = "";
          closeAdminModal();
          loadWaypoints();
        } else {
          alert(result.message || "Erro ao salvar.");
        }
      } catch (err) {
        console.error(err);
        alert("Erro de conexão.");
      } finally {
        btn.innerText = "Salvar Ponto";
        btn.disabled = false;
      }
    }

    // Modo Edição
    function editWaypoint(id) {
      const item = waypointsData.find(w => String(w.id) === String(id));
      if (!item) return;

      document.getElementById("wpId").value = item.id;
      document.getElementById("wpAtividade").value = item.atividade_local;
      document.getElementById("wpDataHora").value = item.data_hora ? item.data_hora.substring(0, 16) : '';
      document.getElementById("wpValorEstimado").value = item.valor_estimado;
      document.getElementById("wpValorPago").value = item.valor_pago;
      document.getElementById("wpPago").checked = item.pago === "Sim";
      document.getElementById("wpMapaUrl").value = item.mapa_url;
      document.getElementById("wpImagemUrl").value = item.imagem_url;
      document.getElementById("wpObservacoes").value = item.observacoes;

      document.getElementById("modalFormTitle").innerText = "Editar Ponto do Roteiro";
      openAdminModal();
      document.getElementById("pinStep").classList.add("hidden");
      document.getElementById("formStep").classList.remove("hidden");
    }
  </script>
</body>
</html>
