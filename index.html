<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ItiGo</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-20">

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZSR3uf1opKMwGW5Ywh147tSlU5-q6YDv1WUTCoQCqTitR8Q9u7i9WD61Dp7RkEuWU/exec";
  </script>

  <header class="sticky top-0 z-40 glass border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <div class="bg-indigo-600 text-white p-2 rounded-xl shadow">
        <i data-lucide="compass" class="w-5 h-5"></i>
      </div>
      <h1 class="font-bold text-xl tracking-tight text-slate-900">Iti<span class="text-indigo-600">Go</span></h1>
    </div>
    
    <button id="btnPin" onclick="toggleModoEdicao()" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full border border-slate-300 bg-white shadow-sm hover:bg-slate-50 active:scale-95 transition">
      <i data-lucide="lock" class="w-3.5 h-3.5 text-amber-500" id="iconLock"></i>
      <span id="txtAdmin">Modo Leitura</span>
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Viagem Selecionada</label>
        <button id="btnNovaViagem" onclick="abrirModalViagem()" class="hidden text-xs text-indigo-600 font-bold hover:underline flex items-center gap-1">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> Nova Viagem
        </button>
      </div>
      <select id="selectViagem" onchange="carregarRoteiroComFocoAutomatico()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">Carregando viagens...</option>
      </select>

      <div id="cardFinanceiro" class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-100 text-center">
        <div class="bg-slate-50 p-2.5 rounded-xl">
          <span class="block text-[10px] font-bold text-slate-400 uppercase">Estimado</span>
          <span id="totalEstimado" class="text-sm font-extrabold text-slate-700">R$ 0</span>
        </div>
        <div class="bg-blue-50 p-2.5 rounded-xl">
          <span class="block text-[10px] font-bold text-blue-600 uppercase">Pago</span>
          <span id="totalPago" class="text-sm font-extrabold text-blue-700">R$ 0</span>
        </div>
        <div id="containerFalta" class="bg-slate-50 p-2.5 rounded-xl transition-colors">
          <span id="labelFalta" class="block text-[10px] font-bold text-slate-500 uppercase">Diferença</span>
          <span id="totalFalta" class="text-sm font-extrabold text-slate-700">R$ 0</span>
        </div>
      </div>
    </div>

    <div class="space-y-3" id="listaWaypoints"></div>
  </main>

  <button id="btnAddWaypoint" onclick="abrirModalWaypoint()" class="hidden fixed bottom-6 right-6 bg-indigo-600 text-white p-4 rounded-full shadow-lg hover:bg-indigo-700 active:scale-90 transition z-30">
    <i data-lucide="plus" class="w-6 h-6"></i>
  </button>

  <!-- Modais Ocultos -->
  <div id="modalPin" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl space-y-4">
      <h3 class="font-bold text-slate-900 text-center text-lg">Digite o PIN</h3>
      <input type="password" id="inputPin" maxlength="6" class="w-full text-center text-2xl font-bold tracking-widest bg-slate-100 border border-slate-200 rounded-xl py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••">
      <div class="flex gap-2">
        <button onclick="fecharModalPin()" class="w-1/2 py-2.5 text-slate-500 font-semibold text-sm">Cancelar</button>
        <button onclick="confirmarPin()" class="w-1/2 py-2.5 bg-indigo-600 text-white font-semibold text-sm rounded-xl shadow">Acessar</button>
      </div>
    </div>
  </div>

  <div id="modalViagem" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl space-y-4">
      <h3 class="font-bold text-slate-900 text-lg">Nova Viagem</h3>
      <input type="text" id="inputNomeViagem" placeholder="Ex: interior de SP/Minas (Capitólio)" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <div class="flex gap-2 justify-end">
        <button onclick="fecharModalViagem()" class="px-4 py-2.5 text-slate-500 font-semibold text-sm">Cancelar</button>
        <button onclick="salvarViagem()" class="px-4 py-2.5 bg-indigo-600 text-white font-semibold text-sm rounded-xl shadow">Salvar</button>
      </div>
    </div>
  </div>

  <div id="modalWaypoint" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 overflow-y-auto">
    <div class="min-h-screen px-4 text-center flex items-center justify-center">
      <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-4 my-8 text-left inline-block align-middle relative">
        <h3 id="tituloModalWp" class="font-bold text-slate-900 text-lg">Novo Waypoint</h3>
        <input type="hidden" id="wpId">
        <div class="space-y-3 text-sm">
          <div><label class="font-semibold text-slate-600 block mb-1">Ponto de Parada / Atividade</label><input type="text" id="wpAtividade" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5" oninput="atualizarPreviews()"></div>
          <div><label class="font-semibold text-slate-600 block mb-1">Cidade</label><input type="text" id="wpCidade" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5" oninput="atualizarPreviews()"></div>
          <div class="grid grid-cols-2 gap-2">
            <div><label class="font-semibold text-slate-600 block mb-1">Data</label><input type="date" id="wpData" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"></div>
            <div><label class="font-semibold text-slate-600 block mb-1">Horário</label><input type="time" id="wpHora" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"></div>
          </div>
          <div id="boxPreviewMaps" class="hidden space-y-2">
            <div class="relative w-full h-40 rounded-xl overflow-hidden border border-slate-200"><iframe id="iframeMapsPreview" class="w-full h-full border-0"></iframe></div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div><label class="font-semibold text-slate-600 block mb-1">Valor Estimado (R$)</label><input type="number" step="0.01" id="wpValorEstimado" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5"></div>
            <div><label class="font-semibold text-slate-600 block mb-1">Valor Pago (R$)</label><input type="number" step="0.01" id="wpValorPago" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5"></div>
          </div>
          <div><label class="font-semibold text-slate-600 block mb-1 text-xs">URL da Foto</label><input type="url" id="wpLinkFoto" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs"></div>
          <div><label class="font-semibold text-slate-600 block mb-1">Observações</label><textarea id="wpObservacoes" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5"></textarea></div>
        </div>
        <div class="flex gap-2 justify-end pt-2 border-t mt-4">
          <button onclick="fecharModalWaypoint()" class="px-4 py-2.5 text-slate-500 font-semibold text-sm">Cancelar</button>
          <button onclick="salvarWaypoint()" class="px-4 py-2.5 bg-indigo-600 text-white font-semibold text-sm rounded-xl shadow">Salvar Waypoint</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modalPagamento" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl space-y-4">
      <h3 class="font-bold text-slate-900 text-lg">Registrar Pagamento</h3>
      <input type="hidden" id="pagWpId">
      <input type="number" step="0.01" id="pagValorInput" class="w-full text-xl font-bold bg-slate-50 border border-slate-200 rounded-xl p-3">
      <div class="flex gap-2">
        <button onclick="fecharModalPagamento()" class="w-1/2 py-2.5 text-slate-500 font-semibold text-sm">Cancelar</button>
        <button onclick="confirmarPagamentoRapido()" class="w-1/2 py-2.5 bg-blue-600 text-white font-semibold text-sm rounded-xl shadow">Confirmar</button>
      </div>
    </div>
  </div>

  <div id="modalLoading" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl flex flex-col items-center space-y-3">
      <div class="animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent"></div>
      <p id="txtLoading" class="font-bold text-slate-800 text-base">Processando...</p>
    </div>
  </div>

  <script>
    let appData = { viagens: [], waypoints: [] };
    let userPin = null;

    window.onload = () => { lucide.createIcons(); verificarPinSalvo(); carregarDados(); };

    function mostrarLoading(t) { document.getElementById('txtLoading').textContent = t; document.getElementById('modalLoading').classList.remove('hidden'); }
    function esconderLoading() { document.getElementById('modalLoading').classList.add('hidden'); }

    function verificarPinSalvo() {
      const pin = localStorage.getItem('itigo_pin');
      if (pin) { userPin = pin; ativarModoEdicaoVisual(); }
    }

    function ativarModoEdicaoVisual() {
      document.getElementById('txtAdmin').textContent = "Modo Leitura";
      document.getElementById('iconLock').setAttribute('data-lucide', 'unlock');
      document.getElementById('btnNovaViagem').classList.remove('hidden');
      document.getElementById('btnAddWaypoint').classList.remove('hidden');
      lucide.createIcons();
    }

    async function API(payload) {
      if (userPin) payload.pin = userPin;
      const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
      return await res.json();
    }

    async function carregarDados() {
      const res = await API({ action: 'getDados' });
      if (res.sucesso) {
        appData = res;
        renderizarSeletorViagem();
      }
    }

    function renderizarSeletorViagem() {
      const select = document.getElementById('selectViagem');
      select.innerHTML = appData.viagens.map(v => `<option value="${v.id}">${v.nome}</option>`).join('');
      carregarRoteiroComFocoAutomatico();
    }

    function carregarRoteiroComFocoAutomatico() {
      const idViagem = document.getElementById('selectViagem').value;
      const waypoints = appData.waypoints.filter(w => w.idViagem === idViagem && w.dataHora);
      let idFoco = null;
      if (waypoints.length > 0) {
        const agora = new Date().getTime();
        idFoco = waypoints.reduce((prev, curr) => 
          Math.abs(new Date(curr.dataHora) - agora) < Math.abs(new Date(prev.dataHora) - agora) ? curr : prev
        ).id;
      }
      carregarRoteiro(idFoco);
    }

    function carregarRoteiro(idFoco = null) {
      const idViagem = document.getElementById('selectViagem').value;
      const container = document.getElementById('listaWaypoints');
      container.innerHTML = '';
      
      const ways = appData.waypoints.filter(w => w.idViagem === idViagem).sort((a,b) => new Date(a.dataHora) - new Date(b.dataHora));
      
      ways.forEach(w => {
        const card = document.createElement('div');
        card.id = `card-wp-${w.id}`;
        card.className = "bg-white rounded-2xl shadow-sm border p-4 transition-all";
        card.innerHTML = `<div><h3 class="font-bold">${w.atividade}</h3><p class="text-xs text-slate-500">${w.cidade}</p></div>
                          <button onclick="abrirModalPagamento('${w.id}', ${w.valorPago})" class="text-blue-600 font-bold text-sm">Pagar</button>`;
        container.appendChild(card);
      });

      if (idFoco) {
        const el = document.getElementById(`card-wp-${idFoco}`);
        if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 200);
      }
      lucide.createIcons();
    }

    async function salvarWaypoint() {
      const wp = { id: document.getElementById('wpId').value, idViagem: document.getElementById('selectViagem').value, atividade: document.getElementById('wpAtividade').value };
      fecharModalWaypoint();
      mostrarLoading("Salvando...");
      const res = await API({ action: 'salvarWaypoint', waypoint: wp });
      if(res.sucesso) {
        await carregarDados();
        carregarRoteiro(wp.id || res.id);
      }
      esconderLoading();
    }

    async function excluirWaypoint(id) {
      mostrarLoading("Excluindo...");
      await API({ action: 'excluirWaypoint', idWaypoint: id });
      await carregarDados(); // Carrega sem forçar scroll
      esconderLoading();
    }

    function abrirModalWaypoint(wp = {}) { document.getElementById('modalWaypoint').classList.remove('hidden'); }
    function fecharModalWaypoint() { document.getElementById('modalWaypoint').classList.add('hidden'); }
    function abrirModalPagamento(id, val) { document.getElementById('pagWpId').value = id; document.getElementById('modalPagamento').classList.remove('hidden'); }
    function fecharModalPagamento() { document.getElementById('modalPagamento').classList.add('hidden'); }
    function toggleModoEdicao() { location.reload(); }
  </script>
</body>
</html>
