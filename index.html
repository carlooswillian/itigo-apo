<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ItiGo App - Roteiros de Viagem</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Flatpickr (Calendário e Relógio Customizados) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_purple.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script>

  <style>
    .flatpickr-calendar { 
      z-index: 999999 !important; 
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              yellow: '#f59e0b'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- Header -->
  <header class="bg-brand-700 text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-compass text-2xl text-amber-400"></i>
        <h1 class="text-2xl font-black tracking-wide">ItiGo <span class="text-amber-400">App</span></h1>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openAdminModal()" class="bg-brand-800 hover:bg-brand-900 text-white text-xs sm:text-sm px-3 py-2 rounded-xl flex items-center gap-2 border border-brand-500 transition shadow">
          <i class="fa-solid fa-lock text-amber-400"></i>
          <span id="adminStatusText">PIN Admin</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-4xl mx-auto px-4 mt-6">
    
    <!-- Filtro e Resumo Financeiro -->
    <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200/80 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      
      <div class="w-full md:w-auto">
        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Selecionar Viagem</label>
        <select id="tripSelect" onchange="onTripChange()" class="w-full md:w-64 bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm font-bold text-brand-800 focus:outline-none focus:ring-2 focus:ring-brand-500">
          <option value="capitolio_2026">Capitólio - MG</option>
          <option value="campos_2026">Campos do Jordão</option>
          <option value="pedra_azul_2026">Pedra Azul</option>
          <option value="maceio_2026">Maceió</option>
        </select>
      </div>

      <div id="financialSummary" class="w-full md:w-auto flex flex-wrap gap-3 text-xs sm:text-sm font-semibold bg-brand-50 p-3 rounded-xl border border-brand-100">
        <div>Total: <span id="totalEstimado" class="text-brand-700 font-bold">R$ 0,00</span></div>
        <div class="text-slate-300">|</div>
        <div>Pago: <span id="totalPago" class="text-emerald-600 font-bold">R$ 0,00</span></div>
        <div class="text-slate-300">|</div>
        <div>Restante: <span id="totalRestante" class="text-amber-600 font-bold">R$ 0,00</span></div>
      </div>
    </div>

    <!-- Timeline do Roteiro -->
    <div id="waypointsList" class="space-y-4"></div>
  </main>

  <!-- Modal Admin -->
  <div id="adminModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full max-h-[92vh] overflow-y-auto p-6 relative border border-slate-100">
      
      <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 z-10">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>

      <!-- Validar PIN -->
      <div id="pinStep" class="text-center py-6">
        <div class="w-16 h-16 bg-brand-100 rounded-full flex items-center justify-center mx-auto mb-3">
          <i class="fa-solid fa-key text-2xl text-brand-600"></i>
        </div>
        <h3 class="text-lg font-bold text-slate-800 mb-1">Painel do Organizador</h3>
        <p class="text-xs text-slate-500 mb-4">Insira sua senha para edições</p>
        
        <input type="password" id="pinInput" placeholder="PIN" maxlength="4" class="text-center tracking-widest text-2xl font-bold border border-slate-300 rounded-xl p-2 w-32 mb-4 focus:outline-none focus:ring-2 focus:ring-brand-500">
        
        <div>
          <button onclick="verifyPin()" class="bg-brand-600 hover:bg-brand-700 text-white font-bold px-6 py-2.5 rounded-xl transition w-32 shadow-md">Entrar</button>
        </div>
      </div>

      <!-- Formulário -->
      <div id="formStep" class="hidden">
        <div class="flex justify-between items-center mb-4">
          <h3 id="modalFormTitle" class="text-lg font-extrabold text-brand-800">Adicionar Novo Ponto</h3>
          <span id="distanciaInfo" class="text-[11px] font-bold bg-amber-100 text-amber-800 px-2 py-1 rounded-lg hidden"></span>
        </div>
        
        <form id="waypointForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
          <input type="hidden" id="wpId">

          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Nome do Local / Atividade</label>
            <div class="flex gap-2">
              <input type="text" id="wpAtividade" required placeholder="Ex: Pico Agudo" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
              <button type="button" onclick="autoSuggest()" class="bg-brand-700 hover:bg-brand-800 text-amber-400 font-bold text-xs px-3 py-2 rounded-xl flex items-center gap-1 transition shadow-sm whitespace-nowrap">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Auto Gerar
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Data e Hora</label>
              <div class="relative">
                <input type="text" id="wpDataHora" required readonly placeholder="Toque para escolher" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-brand-500 outline-none bg-white cursor-pointer">
                <i class="fa-regular fa-calendar-check absolute right-3 top-3 text-slate-400 pointer-events-none"></i>
              </div>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-600 mb-1">Valor Estimado (R$)</label>
              <input type="number" step="0.01" id="wpValorEstimado" placeholder="0.00" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Valor Pago (Sinal ou Total R$)</label>
            <input type="number" step="0.01" id="wpValorPago" placeholder="0.00 se ainda não pagou" class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-brand-500 outline-none">
          </div>

          <!-- Fotos do Local -->
          <div id="imageSearchHelper" class="hidden bg-slate-50 p-3 rounded-2xl border border-slate-200 space-y-2">
            <div class="flex justify-between items-center">
              <label class="block text-xs font-bold text-slate-700">Fotos Sugeridas:</label>
              <button type="button" onclick="searchGoogleImages()" class="text-xs bg-amber-400 hover:bg-amber-500 text-slate-900 font-extrabold px-3 py-1 rounded-lg transition shadow-sm flex items-center gap-1">
                <i class="fa-brands fa-google"></i> Abrir Fotos no Google
              </button>
            </div>
            <div id="imageGallery" class="grid grid-cols-3 gap-2 max-h-36 overflow-y-auto pt-1"></div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">URL da Imagem Selecionada</label>
            <input type="url" id="wpImagemUrl" oninput="previewImageURL()" placeholder="Cole o link da imagem aqui (https://...)" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-brand-500 outline-none">
            <div id="imagePreviewBox" class="mt-2 hidden">
              <img id="imgPreview" src="" class="h-36 w-full object-cover rounded-xl border border-slate-200 shadow-sm">
            </div>
          </div>

          <!-- Mapa Expandido Integrado -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Prévia Expandida da Rota no Mapa</label>
            <input type="hidden" id="wpMapaUrl">
            <div id="mapEmbedContainer" class="w-full h-80 rounded-2xl overflow-hidden border border-slate-200 bg-slate-100 flex items-center justify-center relative shadow-inner">
              <span class="text-xs text-slate-400">Clique em "Auto Gerar" para carregar a rota no mapa.</span>
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Link de Referência (Instagram / TikTok / YouTube)</label>
            <input type="url" id="wpSocialUrl" placeholder="https://instagram.com/p/..." class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-brand-500 outline-none">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Observações</label>
            <textarea id="wpObservacoes" rows="2" placeholder="Notas, senhas de reserva, etc." class="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-brand-500 outline-none"></textarea>
          </div>

          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeAdminModal()" class="px-4 py-2 border border-slate-200 text-slate-600 text-sm font-semibold rounded-xl hover:bg-slate-50">Cancelar</button>
            <button type="submit" id="btnSave" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold rounded-xl transition shadow">Salvar Ponto</button>
          </div>
        </form>
      </div>

    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyvlltkuspMMfkpbSbHXujbKBYKVJ-AMSSBURae5RUP0qaLmvM97N2LJg5xdynfdKS1/exec";
    
    let currentPin = "";
    let waypointsData = [];
    let fpInstance = null;

    document.addEventListener("DOMContentLoaded", () => {
      loadWaypoints();
    });

    // Força o Flatpickr Customizado mesmo no Android/iOS
    function initFlatpickr() {
      if (fpInstance) fpInstance.destroy();
      
      fpInstance = flatpickr("#wpDataHora", {
        disableMobile: true, // Força a interface roxa do calendário no mobile
        enableTime: true,
        dateFormat: "Y-m-d H:i",
        altInput: true,
        altFormat: "d/m/Y às H:i",
        locale: "pt",
        time_24hr: true,
        minuteIncrement: 5,
        onChange: function() {
          checkDistancePreview();
          updateEmbeddedMap();
        }
      });
    }

    function onTripChange() {
      loadWaypoints();
    }

    async function loadWaypoints() {
      const tripId = document.getElementById("tripSelect").value;
      const container = document.getElementById("waypointsList");
      container.innerHTML = `<div class="text-center py-12 text-slate-400 font-medium"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Carregando roteiro...</div>`;

      try {
        const response = await fetch(`${API_URL}?action=getWaypoints&trip_id=${tripId}`);
        waypointsData = await response.json();
        
        renderWaypoints(waypointsData);
        calculateFinancials(waypointsData);
      } catch (err) {
        console.error("Erro:", err);
        container.innerHTML = `<div class="text-center py-8 text-red-500 font-semibold">Erro ao carregar roteiro. Verifique a conexão.</div>`;
      }
    }

    function renderWaypoints(items) {
      const container = document.getElementById("waypointsList");
      if (!items || items.length === 0) {
        container.innerHTML = `<div class="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300 text-slate-400 font-medium">Nenhum ponto neste roteiro ainda.</div>`;
        return;
      }

      container.innerHTML = items.map((wp) => {
        const dataFormatada = wp.data_hora ? new Date(wp.data_hora).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : 'A definir';
        
        const est = parseFloat(wp.valor_estimado || 0);
        const pago = parseFloat(wp.valor_pago || 0);
        const restante = est - pago;

        let statusBadge = '';
        if (pago >= est && est > 0) {
          statusBadge = `<span class="bg-emerald-100 text-emerald-800 text-[10px] font-extrabold px-2 py-0.5 rounded-md"><i class="fa-solid fa-check"></i> Pago</span>`;
        } else if (pago > 0 && pago < est) {
          statusBadge = `<span class="bg-amber-100 text-amber-800 text-[10px] font-extrabold px-2 py-0.5 rounded-md"><i class="fa-solid fa-pie-chart"></i> Sinal Pago (Falta R$ ${restante.toFixed(2)})</span>`;
        } else if (est > 0) {
          statusBadge = `<span class="bg-slate-100 text-slate-600 text-[10px] font-bold px-2 py-0.5 rounded-md">Pendente</span>`;
        }

        return `
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden flex flex-col sm:flex-row hover:shadow-md transition">
            ${wp.imagem_url ? `
              <div class="sm:w-1/3 h-44 sm:h-auto bg-cover bg-center" style="background-image: url('${wp.imagem_url}')"></div>
            ` : ''}
            
            <div class="p-4 sm:p-5 flex-1 flex flex-col justify-between">
              <div>
                <div class="flex justify-between items-start gap-2 mb-1">
                  <span class="text-xs font-extrabold text-brand-700 bg-brand-50 px-2.5 py-1 rounded-lg inline-flex items-center">
                    <i class="fa-regular fa-clock mr-1.5 text-amber-500"></i>${dataFormatada}
                  </span>
                  ${statusBadge}
                </div>

                <h3 class="text-base sm:text-lg font-bold text-slate-800 mt-1">${wp.atividade_local}</h3>
                ${wp.observacoes ? `<p class="text-xs text-slate-500 mt-1">${wp.observacoes}</p>` : ''}
              </div>

              <div class="mt-4 pt-3 border-t border-slate-100 flex flex-col gap-2">
                <div class="flex flex-wrap justify-between items-center text-xs gap-2">
                  <div>
                    <span class="text-slate-400">Est:</span> <strong class="text-slate-700">R$ ${est.toFixed(2)}</strong>
                    <span class="mx-1 text-slate-300">|</span>
                    <span class="text-slate-400">Pago:</span> <strong class="text-emerald-600">R$ ${pago.toFixed(2)}</strong>
                  </div>

                  <div class="flex items-center gap-2">
                    ${wp.social_url ? `
                      <a href="${wp.social_url}" target="_blank" class="text-slate-400 hover:text-pink-600 transition" title="Ver Mídia">
                        <i class="fa-brands fa-instagram text-base"></i>
                      </a>
                    ` : ''}
                    
                    ${wp.mapa_url ? `
                      <a href="${wp.mapa_url}" target="_blank" class="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1.5 transition shadow-sm">
                        <i class="fa-solid fa-diamond-turn-right"></i> Abrir Mapa
                      </a>
                    ` : ''}

                    ${currentPin ? `
                      <button onclick="editWaypoint('${wp.id}')" class="text-slate-400 hover:text-brand-600 text-xs p-1">
                        <i class="fa-solid fa-pen-to-square text-sm"></i>
                      </button>
                    ` : ''}
                  </div>
                </div>

                ${currentPin ? `
                  <div class="mt-2 bg-slate-50 p-2 rounded-xl border border-slate-200 flex items-center gap-2">
                    <span class="text-[11px] font-bold text-slate-500">Lançar Pago:</span>
                    <input type="number" id="quickPay_${wp.id}" value="${pago > 0 ? pago : ''}" placeholder="R$ 0.00" class="w-24 bg-white border border-slate-300 rounded-lg p-1 text-xs font-bold text-slate-800 outline-none focus:ring-1 focus:ring-brand-500">
                    <button onclick="saveQuickPay('${wp.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-2.5 py-1 rounded-lg transition">
                      OK
                    </button>
                  </div>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Auto Gerar: Busca de imagens reais via API do Wikimedia Commons + LoremFlickr
    async function autoSuggest() {
      const local = document.getElementById("wpAtividade").value.trim();
      if (!local) return alert("Digite o nome do local primeiro.");

      updateEmbeddedMap();
      document.getElementById("imageSearchHelper").classList.remove("hidden");
      
      const gallery = document.getElementById("imageGallery");
      gallery.innerHTML = `<div class="col-span-3 text-center py-4 text-xs text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Buscando fotos de ${local}...</div>`;

      try {
        const wikiUrl = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gteisearch=${encodeURIComponent(local)}&gsrsearch=${encodeURIComponent(local)}&gsrnamespace=6&gsrlimit=6&prop=imageinfo&iiprop=url&format=json&origin=*`;
        
        const res = await fetch(wikiUrl);
        const data = await res.json();
        
        let photoUrls = [];

        if (data.query && data.query.pages) {
          Object.values(data.query.pages).forEach(page => {
            if (page.imageinfo && page.imageinfo[0] && page.imageinfo[0].url) {
              const imgUrl = page.imageinfo[0].url;
              if (imgUrl.match(/\.(jpg|jpeg|png|webp)$/i)) {
                photoUrls.push(imgUrl);
              }
            }
          });
        }

        if (photoUrls.length === 0) {
          const cleanTerm = encodeURIComponent(local.split(" ")[0]);
          photoUrls = [
            `https://loremflickr.com/600/400/${cleanTerm}?lock=1`,
            `https://loremflickr.com/600/400/${cleanTerm}?lock=2`,
            `https://loremflickr.com/600/400/${cleanTerm}?lock=3`
          ];
        }

        gallery.innerHTML = photoUrls.map((url) => `
          <div class="relative group cursor-pointer overflow-hidden rounded-lg border border-slate-200 bg-slate-100 h-20" onclick="selectImage('${url}')">
            <img src="${url}" class="h-full w-full object-cover hover:scale-105 transition" onerror="this.parentElement.remove()">
          </div>
        `).join('');

        if (photoUrls.length > 0) {
          selectImage(photoUrls[0]);
        }

      } catch (err) {
        console.error("Erro na busca de imagem:", err);
        const cleanTerm = encodeURIComponent(local.split(" ")[0]);
        const fallbackUrl = `https://loremflickr.com/600/400/${cleanTerm}`;
        gallery.innerHTML = `
          <div class="col-span-3">
            <div class="relative cursor-pointer overflow-hidden rounded-lg border border-slate-200 h-20" onclick="selectImage('${fallbackUrl}')">
              <img src="${fallbackUrl}" class="h-full w-full object-cover">
            </div>
          </div>
        `;
        selectImage(fallbackUrl);
      }
    }

    // Pesquisa limpa no Google Imagens sem anexar o destino da viagem
    function searchGoogleImages() {
      const local = document.getElementById("wpAtividade").value.trim();
      if (!local) return alert("Digite o nome do local primeiro.");
      
      const query = encodeURIComponent(local);
      window.open(`https://www.google.com/search?tbm=isch&q=${query}`, '_blank');
    }

    function selectImage(url) {
      document.getElementById("wpImagemUrl").value = url;
      previewImageURL();
    }

    function previewImageURL() {
      const url = document.getElementById("wpImagemUrl").value;
      const previewBox = document.getElementById("imagePreviewBox");
      const img = document.getElementById("imgPreview");

      if (url && url.startsWith("http")) {
        img.src = url;
        previewBox.classList.remove("hidden");
      } else {
        previewBox.classList.add("hidden");
      }
    }

    // Busca de mapa limpa (usa apenas o local exato digitado)
    function updateEmbeddedMap() {
      const localAtual = document.getElementById("wpAtividade").value.trim();
      if (!localAtual) return;

      const selectedTime = new Date(document.getElementById("wpDataHora").value);

      const previousWp = waypointsData
        .filter(w => new Date(w.data_hora) < selectedTime)
        .pop();

      let mapSearchQuery = "";
      if (previousWp && previousWp.atividade_local) {
        mapSearchQuery = `from ${previousWp.atividade_local} to ${localAtual}`;
      } else {
        mapSearchQuery = localAtual;
      }

      const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapSearchQuery)}`;
      document.getElementById("wpMapaUrl").value = mapUrl;

      const embedUrl = `https://maps.google.com/maps?q=${encodeURIComponent(mapSearchQuery)}&t=&z=12&ie=UTF8&iwloc=&output=embed`;
      document.getElementById("mapEmbedContainer").innerHTML = `
        <iframe width="100%" height="100%" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" src="${embedUrl}" class="rounded-2xl"></iframe>
      `;
    }

    function checkDistancePreview() {
      const selectedTime = new Date(document.getElementById("wpDataHora").value);
      if (isNaN(selectedTime)) return;

      const previous = waypointsData
        .filter(w => new Date(w.data_hora) < selectedTime)
        .pop();

      const badge = document.getElementById("distanciaInfo");
      if (previous) {
        badge.innerText = `Anterior: ${previous.atividade_local}`;
        badge.classList.remove("hidden");
      } else {
        badge.classList.add("hidden");
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById("btnSave");
      btn.innerText = "Salvando...";
      btn.disabled = true;

      const payload = {
        pin: currentPin,
        action: "saveWaypoint",
        waypoint: {
          id: document.getElementById("wpId").value,
          trip_id: document.getElementById("tripSelect").value,
          atividade_local: document.getElementById("wpAtividade").value,
          data_hora: document.getElementById("wpDataHora").value,
          valor_estimado: document.getElementById("wpValorEstimado").value,
          valor_pago: document.getElementById("wpValorPago").value,
          mapa_url: document.getElementById("wpMapaUrl").value,
          imagem_url: document.getElementById("wpImagemUrl").value,
          social_url: document.getElementById("wpSocialUrl").value,
          observacoes: document.getElementById("wpObservacoes").value
        }
      };

      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const result = await res.json();

        if (result.success) {
          document.getElementById("waypointForm").reset();
          document.getElementById("wpId").value = "";
          document.getElementById("imageSearchHelper").classList.add("hidden");
          document.getElementById("imagePreviewBox").classList.add("hidden");
          document.getElementById("mapEmbedContainer").innerHTML = `<span class="text-xs text-slate-400">Clique em "Auto Gerar" para carregar o mapa.</span>`;
          closeAdminModal();
          loadWaypoints();
        } else {
          alert(result.message);
        }
      } catch (err) {
        alert("Erro de conexão ao salvar.");
      } finally {
        btn.innerText = "Salvar Ponto";
        btn.disabled = false;
      }
    }

    function editWaypoint(id) {
      const item = waypointsData.find(w => String(w.id) === String(id));
      if (!item) return;

      document.getElementById("wpId").value = item.id;
      document.getElementById("wpAtividade").value = item.atividade_local;
      
      openAdminModal();
      document.getElementById("pinStep").classList.add("hidden");
      document.getElementById("formStep").classList.remove("hidden");

      setTimeout(() => {
        initFlatpickr();
        if (fpInstance && item.data_hora) {
          fpInstance.setDate(item.data_hora);
        }
      }, 100);

      document.getElementById("wpValorEstimado").value = item.valor_estimado;
      document.getElementById("wpValorPago").value = item.valor_pago;
      document.getElementById("wpMapaUrl").value = item.mapa_url;
      document.getElementById("wpImagemUrl").value = item.imagem_url;
      document.getElementById("wpSocialUrl").value = item.social_url || '';
      document.getElementById("wpObservacoes").value = item.observacoes;

      document.getElementById("modalFormTitle").innerText = "Editar Ponto";
      previewImageURL();
      updateEmbeddedMap();
    }

    async function saveQuickPay(id) {
      const valor = document.getElementById(`quickPay_${id}`).value;
      if (valor === "") return;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            pin: currentPin,
            action: "updateQuickPay",
            id: id,
            valor_pago: parseFloat(valor)
          })
        });
        const data = await res.json();
        if (data.success) {
          loadWaypoints();
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert("Erro ao atualizar valor.");
      }
    }

    function calculateFinancials(items) {
      let est = 0, pag = 0;
      items.forEach(i => {
        est += parseFloat(i.valor_estimado || 0);
        pag += parseFloat(i.valor_pago || 0);
      });

      document.getElementById("totalEstimado").innerText = `R$ ${est.toFixed(2)}`;
      document.getElementById("totalPago").innerText = `R$ ${pag.toFixed(2)}`;
      document.getElementById("totalRestante").innerText = `R$ ${(est - pag).toFixed(2)}`;
    }

    function openAdminModal() {
      document.getElementById("adminModal").classList.remove("hidden");
    }

    function closeAdminModal() {
      document.getElementById("adminModal").classList.add("hidden");
    }

    function verifyPin() {
      const input = document.getElementById("pinInput").value;
      if (input === "1304") {
        currentPin = input;
        document.getElementById("adminStatusText").innerText = "Admin Ativo";
        document.getElementById("pinStep").classList.add("hidden");
        document.getElementById("formStep").classList.remove("hidden");
        initFlatpickr();
        renderWaypoints(waypointsData);
      } else {
        alert("PIN incorreto!");
      }
    }
  </script>
</body>
</html>
