<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ItiGo</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-20">

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZSR3uf1opKMwGW5Ywh147tSlU5-q6YDv1WUTCoQCqTitR8Q9u7i9WD61Dp7RkEuWU/exec";
  </script>

  <header class="sticky top-0 z-40 glass border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <div class="bg-indigo-600 text-white p-2 rounded-xl shadow">
        <i data-lucide="compass" class="w-5 h-5"></i>
      </div>
      <h1 class="font-bold text-xl tracking-tight text-slate-900">Iti<span class="text-indigo-600">Go</span></h1>
    </div>
    
    <button id="btnPin" onclick="toggleModoEdicao()" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-full border border-slate-300 bg-white shadow-sm hover:bg-slate-50 active:scale-95 transition">
      <i data-lucide="lock" class="w-3.5 h-3.5 text-amber-500" id="iconLock"></i>
      <span id="txtAdmin">Modo de Edição</span>
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Viagem Selecionada</label>
        <button id="btnNovaViagem" onclick="abrirModalViagem()" class="hidden text-xs text-indigo-600 font-bold hover:underline flex items-center gap-1">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> Nova Viagem
        </button>
      </div>
      <select id="selectViagem" onchange="carregarRoteiro()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">Carregando viagens...</option>
      </select>

      <div id="cardFinanceiro" class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-100 text-center">
        <div class="bg-slate-50 p-2.5 rounded-xl">
          <span class="block text-[10px] font-bold text-slate-400 uppercase">Estimado</span>
          <span id="totalEstimado" class="text-sm font-extrabold text-slate-700">R$ 0</span>
        </div>
        <div class="bg-emerald-50 p-2.5 rounded-xl">
          <span class="block text-[10px] font-bold text-emerald-600 uppercase">Pago</span>
          <span id="totalPago" class="text-sm font-extrabold text-emerald-700">R$ 0</span>
        </div>
        <div id="boxDiferencaTotal" class="bg-slate-50 p-2.5 rounded-xl">
          <span class="block text-[10px] font-bold text-slate-400 uppercase" id="lblDiferencaTotal">Diferença</span>
          <span id="totalDiferenca" class="text-sm font-extrabold text-slate-700">R$ 0</span>
        </div>
      </div>
    </div>

    <div class="space-y-3" id="listaWaypoints"></div>

  </main>

  <button id="btnAddWaypoint" onclick="abrirModalWaypoint()" class="hidden fixed bottom-6 right-6 bg-indigo-600 text-white p-4 rounded-full shadow-lg hover:bg-indigo-700 active:scale-90 transition z-30">
    <i data-lucide="plus" class="w-6 h-6"></i>
  </button>

  <!-- Modais Omitidos para brevidade, mantêm a mesma estrutura que você já possui -->
  
  <script>
    let appData = { viagens: [], waypoints: [] };
    let userPin = null;

    const TEMPO_EXPIRACAO_PIN = 24 * 60 * 60 * 1000;

    window.onload = () => {
      lucide.createIcons();
      verificarPinSalvo();
      carregarDados();
    };

    function verificarPinSalvo() {
      const pinSalvo = localStorage.getItem('itigo_pin');
      const timestampSalvo = localStorage.getItem('itigo_timestamp');

      if (pinSalvo && timestampSalvo) {
        const agora = new Date().getTime();
        const tempoDecorrido = agora - parseInt(timestampSalvo, 10);

        if (tempoDecorrido < TEMPO_EXPIRACAO_PIN) {
          userPin = pinSalvo;
          ativarModoEdicaoVisual();
        }
      }
    }

    function ativarModoEdicaoVisual() {
      document.getElementById('txtAdmin').textContent = "Modo de Leitura";
      document.getElementById('iconLock').setAttribute('data-lucide', 'unlock');
      document.getElementById('btnNovaViagem').classList.remove('hidden');
      document.getElementById('btnAddWaypoint').classList.remove('hidden');
      lucide.createIcons();
    }

    async function API(payload) {
      if (userPin) payload.pin = userPin;
      const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
      return await res.json();
    }

    async function carregarDados() {
      try {
        const res = await API({ action: 'getDados' });
        if (res.sucesso) {
          appData = res;
          renderizarSeletorViagem();
        }
      } catch(e) { alert("Erro ao carregar dados."); }
    }

    function carregarRoteiro() {
      const idViagem = document.getElementById('selectViagem').value;
      const container = document.getElementById('listaWaypoints');
      container.innerHTML = '';
      const waypoints = appData.waypoints.filter(w => w.idViagem === idViagem);

      let est = 0, pago = 0;
      waypoints.forEach(w => { est += w.valorEstimado; pago += w.valorPago; });

      const diferencaTotal = pago - est;
      const boxDifTotal = document.getElementById('boxDiferencaTotal');
      const lblDifTotal = document.getElementById('lblDiferencaTotal');
      const valDifTotal = document.getElementById('totalDiferenca');

      document.getElementById('totalEstimado').textContent = `R$ ${est.toFixed(2)}`;
      document.getElementById('totalPago').textContent = `R$ ${pago.toFixed(2)}`;
      valDifTotal.textContent = `R$ ${Math.abs(diferencaTotal).toFixed(2)}`;

      if (diferencaTotal > 0) {
        boxDifTotal.className = "bg-rose-50 p-2.5 rounded-xl";
        valDifTotal.className = "text-sm font-extrabold text-rose-700";
      } else if (diferencaTotal < 0) {
        boxDifTotal.className = "bg-emerald-50 p-2.5 rounded-xl";
        valDifTotal.className = "text-sm font-extrabold text-emerald-700";
      }

      waypoints.forEach(w => {
        const diffWp = w.valorPago - w.valorEstimado;
        // ... (resto do render do card)
      });
      lucide.createIcons();
    }

    // CORREÇÃO APLICADA AQUI
    async function salvarWaypoint() {
      const idViagem = document.getElementById('selectViagem').value;
      const wp = {
        idViagem: idViagem,
        atividade: document.getElementById('wpAtividade').value,
        cidade: document.getElementById('wpCidade').value,
        dataHora: document.getElementById('wpDataHora').value, // <--- AQUI ESTAVA O COLCHETE ERRADO
        valorEstimado: parseFloat(document.getElementById('wpValorEstimado').value) || 0,
        valorPago: parseFloat(document.getElementById('wpValorPago').value) || 0
        // ... outros campos
      };
      
      const res = await API({ action: 'salvarWaypoint', waypoint: wp });
      if(res.sucesso) { fecharModalWaypoint(); await carregarDados(); }
    }

    function toggleModoEdicao() {
      if (userPin) {
        userPin = null;
        localStorage.removeItem('itigo_pin');
        document.getElementById('txtAdmin').textContent = "Modo de Edição";
        document.getElementById('iconLock').setAttribute('data-lucide', 'lock');
        location.reload();
      } else {
        document.getElementById('modalPin').classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
