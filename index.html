<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ItiGo</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-20">

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyZSR3uf1opKMwGW5Ywh147tSlU5-q6YDv1WUTCoQCqTitR8Q9u7i9WD61Dp7RkEuWU/exec";
  </script>

  <header class="sticky top-0 z-40 glass border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <div class="bg-indigo-600 text-white p-2 rounded-xl shadow">
        <i data-lucide="compass" class="w-5 h-5"></i>
      </div>
      <h1 class="font-bold text-xl tracking-tight text-slate-900">Iti<span class="text-indigo-600">Go</span></h1>
    </div>
    
    <button id="btnPin" onclick="toggleModoEdicao()" class="flex items-center justify-center p-2 rounded-xl border border-slate-300 bg-white shadow-sm hover:bg-slate-50 active:scale-95 transition" title="Alternar Modo de Edição">
      <i data-lucide="lock" class="w-5 h-5 text-amber-500" id="iconLock"></i>
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Viagem Selecionada</label>
        <button id="btnNovaViagem" onclick="abrirModalViagem()" class="hidden text-xs text-indigo-600 font-bold hover:underline flex items-center gap-1">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> Nova Viagem
        </button>
      </div>
      <select id="selectViagem" onchange="carregarRoteiroComFocoAutomatico()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <option value="">Carregando viagens...</option>
      </select>

      <!-- Botão de Compartilhar Link da Viagem -->
      <button id="btnCompartilharViagem" onclick="compartilharViagemAtual()" class="w-full flex items-center justify-center gap-2 text-xs font-bold text-indigo-600 bg-indigo-50 border border-indigo-100 py-2.5 rounded-xl hover:bg-indigo-100 transition">
        <i data-lucide="share-2" class="w-4 h-4"></i>
        <span>Compartilhar Link desta Viagem</span>
      </button>

      <div id="cardFinanceiro" class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-100 text-center">
        <div class="bg-slate-50 p-2.5 rounded-xl">
          <span class="block text-[10px] font-bold text-slate-400 uppercase">Orçado</span>
          <span id="totalOrcado" class="text-sm font-extrabold text-slate-700">R$ 0</span>
        </div>
        <div class="bg-blue-50 p-2.5 rounded-xl">
          <span class="block text-[10px] font-bold text-blue-600 uppercase">Pago</span>
          <span id="totalPago" class="text-sm font-extrabold text-blue-700">R$ 0</span>
        </div>
        <div id="containerFalta" class="bg-slate-50 p-2.5 rounded-xl transition-colors">
          <span id="labelFalta" class="block text-[10px] font-bold text-slate-500 uppercase">Diferença</span>
          <span id="totalFalta" class="text-sm font-extrabold text-slate-700">R$ 0</span>
        </div>
      </div>
    </div>

    <div class="space-y-4" id="listaWaypoints"></div>

  </main>

  <button id="btnAddWaypoint" onclick="abrirModalWaypoint()" class="hidden fixed bottom-6 right-6 bg-indigo-600 text-white p-4 rounded-full shadow-lg hover:bg-indigo-700 active:scale-90 transition z-30">
    <i data-lucide="plus" class="w-6 h-6"></i>
  </button>

  <div id="modalPin" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl space-y-4">
      <h3 class="font-bold text-slate-900 text-center text-lg">Digite o PIN</h3>
      <input type="password" id="inputPin" maxlength="6" class="w-full text-center text-2xl font-bold tracking-widest bg-slate-100 border border-slate-200 rounded-xl py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••">
      <div class="flex gap-2">
        <button onclick="fecharModalPin()" class="w-1/2 py-2.5 text-slate-500 font-semibold text-sm">Cancelar</button>
        <button onclick="confirmarPin()" class="w-1/2 py-2.5 bg-indigo-600 text-white font-semibold text-sm rounded-xl shadow">Acessar</button>
      </div>
    </div>
  </div>

  <div id="modalViagem" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl space-y-4">
      <h3 class="font-bold text-slate-900 text-lg">Nova Viagem</h3>
      <input type="text" id="inputNomeViagem" placeholder="Ex: interior de SP/Minas (Capitólio)" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <div class="flex gap-2 justify-end">
        <button onclick="fecharModalViagem()" class="px-4 py-2.5 text-slate-500 font-semibold text-sm">Cancelar</button>
        <button onclick="salvarViagem()" class="px-4 py-2.5 bg-indigo-600 text-white font-semibold text-sm rounded-xl shadow">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Modal Waypoint Completo -->
  <div id="modalWaypoint" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 overflow-y-auto">
    <div class="min-h-screen px-4 text-center flex items-center justify-center">
      <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl space-y-4 my-8 text-left inline-block align-middle relative">
        <div class="flex justify-between items-center">
          <h3 id="tituloModalWp" class="font-bold text-slate-900 text-lg">Novo Waypoint</h3>
          <button id="btnExcluirModal" onclick="excluirWaypointDoModal()" class="hidden text-rose-500 hover:text-rose-700 p-2 rounded-xl hover:bg-rose-50 transition flex items-center gap-1 text-xs font-semibold">
            <i data-lucide="trash-2" class="w-4 h-4"></i> Excluir
          </button>
        </div>
        <input type="hidden" id="wpId">

        <div class="space-y-3 text-sm">
          <div>
            <label class="font-semibold text-slate-600 block mb-1">Ponto de Parada / Atividade</label>
            <input type="text" id="wpAtividade" placeholder="Ex: Praia do Forte / Café da manhã" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5" oninput="atualizarPreviews()">
          </div>

          <div>
            <label class="font-semibold text-slate-600 block mb-1">Cidade <span class="text-slate-400 font-normal text-xs">(Opcional para itens genéricos)</span></label>
            <input type="text" id="wpCidade" placeholder="Ex: Cabo Frio" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5" oninput="atualizarPreviews()">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="font-semibold text-slate-600 block mb-1">Data</label>
              <input type="date" id="wpData" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs">
            </div>
            <div>
              <label class="font-semibold text-slate-600 block mb-1">Horário</label>
              <input type="time" id="wpHora" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs">
            </div>
          </div>

          <div id="boxPreviewMaps" class="hidden space-y-2">
            <label class="font-semibold text-slate-600 block text-xs">Pré-visualização do Local (Maps)</label>
            <div class="relative w-full h-40 rounded-xl overflow-hidden border border-slate-200 shadow-inner bg-slate-100">
              <iframe 
                id="iframeMapsPreview" 
                class="w-full h-full border-0" 
                loading="lazy" 
                allowfullscreen
                style="touch-action: pan-x pan-y pinch-zoom; pointer-events: auto;">
              </iframe>
            </div>
            <div class="flex justify-end">
              <a id="btnTestarMaps" href="#" target="_blank" class="text-indigo-600 hover:text-indigo-700 text-xs font-bold flex items-center gap-1">
                <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Abrir no Google Maps
              </a>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="font-semibold text-slate-600 block mb-1">Valor Orçado (R$)</label>
              <input type="number" step="0.01" id="wpValorOrcado" placeholder="0.00" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5">
            </div>
            <div>
              <label class="font-semibold text-slate-600 block mb-1">Valor Pago (R$)</label>
              <input type="number" step="0.01" id="wpValorPago" placeholder="0.00" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5">
            </div>
          </div>

          <div class="space-y-2">
            <div class="flex justify-between items-center">
              <label class="font-semibold text-slate-600 block text-xs">Foto do Lugar (URL da Imagem)</label>
              <a id="btnPesquisarImagens" href="#" target="_blank" class="text-indigo-600 hover:text-indigo-700 text-xs font-bold flex items-center gap-1">
                <i data-lucide="image" class="w-3.5 h-3.5"></i> Buscar no Google Imagens
              </a>
            </div>
            <input type="url" id="wpLinkFoto" placeholder="https://..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs" oninput="atualizarPreviewFoto()">
            
            <div id="boxPreviewFoto" class="hidden relative w-full h-36 rounded-xl overflow-hidden border border-slate-200 shadow-inner bg-slate-100">
              <img id="imgPreview" class="w-full h-full object-cover" alt="Prévia da foto" onerror="this.src=''; document.getElementById('erroFoto').classList.remove('hidden');">
              <div id="erroFoto" class="hidden absolute inset-0 bg-slate-900/60 text-white text-xs flex items-center justify-center font-medium p-2 text-center">
                Não foi possível carregar a imagem com este link.
              </div>
            </div>
          </div>

          <div>
            <label class="font-semibold text-slate-600 block mb-1">Link de Vídeo / Mídia (Insta, YT)</label>
            <input type="url" id="wpLinkMidia" placeholder="https://instagram.com/..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs">
          </div>

          <div>
            <label class="font-semibold text-slate-600 block mb-1">Observações</label>
            <textarea id="wpObservacoes" rows="2" placeholder="Dicas de prato, horário ideal..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5"></textarea>
          </div>
        </div>

        <div class="flex gap-2 justify-end pt-2 border-t mt-4">
          <button onclick="fecharModalWaypoint()" class="px-4 py-2.5 text-slate-500 font-semibold text-sm">Cancelar</button>
          <button onclick="salvarWaypoint()" class="px-4 py-2.5 bg-indigo-600 text-white font-semibold text-sm rounded-xl shadow">Salvar Waypoint</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modalPagamento" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl space-y-4">
      <h3 class="font-bold text-slate-900 text-lg">Registrar Pagamento</h3>
      <input type="hidden" id="pagWpId">
      <div>
        <label class="text-xs font-semibold text-slate-500">Valor Pago Agora (R$)</label>
        <input type="number" step="0.01" id="pagValorInput" class="w-full text-xl font-bold bg-slate-50 border border-slate-200 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="flex gap-2">
        <button onclick="fecharModalPagamento()" class="w-1/2 py-2.5 text-slate-500 font-semibold text-sm">Cancelar</button>
        <button onclick="confirmarPagamentoRapido()" class="w-1/2 py-2.5 bg-blue-600 text-white font-semibold text-sm rounded-xl shadow">Confirmar</button>
      </div>
    </div>
  </div>

  <div id="modalLoading" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl flex flex-col items-center space-y-3">
      <div class="animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent"></div>
      <p id="txtLoading" class="font-bold text-slate-800 text-base">Processando...</p>
    </div>
  </div>

  <script>
    let appData = { viagens: [], waypoints: [] };
    let userPin = null;
    let modoLeituraForcado = false;

    const TEMPO_EXPIRACAO_PIN = 24 * 60 * 60 * 1000;

    window.onload = () => {
      lucide.createIcons();
      verificarPinSalvo();
      carregarDadosDaURL();
    };

    async function carregarDadosDaURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const viagemIdUrl = urlParams.get('viagem');
      modoLeituraForcado = urlParams.get('modo') === 'leitura';

      if (modoLeituraForcado) {
        userPin = null;
        document.getElementById('btnPin').style.display = 'none';
        document.getElementById('btnCompartilharViagem').style.display = 'none';
        document.getElementById('btnNovaViagem').style.display = 'none';
      }

      try {
        const res = await API({ action: 'getDados' });
        if (res.sucesso) {
          appData = res;
          renderizarSeletorViagem();

          if (viagemIdUrl) {
            const select = document.getElementById('selectViagem');
            select.value = viagemIdUrl;
            
            if (!select.value && select.options.length > 0) {
              select.selectedIndex = 0;
            }

            if (modoLeituraForcado) {
              select.disabled = true;
              select.classList.add('bg-slate-200', 'cursor-not-allowed', 'opacity-80');
            }
          }
          carregarRoteiroComFocoAutomatico();
        }
      } catch(e) {
        alert("Erro ao conectar com a planilha. Verifique a URL do Script.");
      }
    }

    function compartilharViagemAtual() {
      const selectViagem = document.getElementById('selectViagem');
      const viagemId = selectViagem.value;
      const nomeViagem = selectViagem.options[selectViagem.selectedIndex]?.text || "Viagem";

      if (!viagemId) {
        alert("Selecione uma viagem primeiro.");
        return;
      }

      const baseURL = window.location.origin + window.location.pathname;
      const linkCompartilhamento = `${baseURL}?viagem=${viagemId}&modo=leitura`;

      if (navigator.clipboard) {
        navigator.clipboard.writeText(linkCompartilhamento).then(() => {
          alert(`Link da viagem "${nomeViagem}" copiado com sucesso!`);
        });
      } else {
        prompt("Copie o link abaixo:", linkCompartilhamento);
      }
    }

    function mostrarLoading(texto = "Processando...") {
      document.getElementById('txtLoading').textContent = texto;
      document.getElementById('modalLoading').classList.remove('hidden');
    }

    function esconderLoading() {
      document.getElementById('modalLoading').classList.add('hidden');
    }

    function verificarPinSalvo() {
      const pinSalvo = localStorage.getItem('itigo_pin');
      const timestampSalvo = localStorage.getItem('itigo_timestamp');

      if (pinSalvo && timestampSalvo) {
        const agora = new Date().getTime();
        const tempoDecorrido = agora - parseInt(timestampSalvo, 10);

        if (tempoDecorrido < TEMPO_EXPIRACAO_PIN) {
          userPin = pinSalvo;
          ativarModoEdicaoVisual();
        } else {
          localStorage.removeItem('itigo_pin');
          localStorage.removeItem('itigo_timestamp');
        }
      }
    }

    function ativarModoEdicaoVisual() {
      document.getElementById('iconLock').setAttribute('data-lucide', 'unlock');
      document.getElementById('btnNovaViagem').classList.remove('hidden');
      document.getElementById('btnAddWaypoint').classList.remove('hidden');
      carregarRoteiroComFocoAutomatico();
      lucide.createIcons();
    }

    async function API(payload) {
      if (userPin) payload.pin = userPin;
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    function renderizarSeletorViagem() {
      const select = document.getElementById('selectViagem');
      select.innerHTML = '';

      if (appData.viagens.length === 0) {
        select.innerHTML = '<option value="">Nenhuma viagem encontrada</option>';
        return;
      }

      appData.viagens.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.id;
        opt.textContent = v.nome;
        select.appendChild(opt);
      });

      carregarRoteiroComFocoAutomatico();
    }

    function carregarRoteiroComFocoAutomatico() {
      const idViagem = document.getElementById('selectViagem').value;
      const waypointsViagem = appData.waypoints.filter(w => w.idViagem === idViagem && w.dataHora);

      let idMaisProximo = null;
      if (waypointsViagem.length > 0) {
        const agora = new Date().getTime();
        let menorDiferenca = Infinity;

        waypointsViagem.forEach(w => {
          const tempoWp = new Date(w.dataHora).getTime();
          if (!isNaN(tempoWp)) {
            const diferenca = Math.abs(tempoWp - agora);
            if (diferenca < menorDiferenca) {
              menorDiferenca = diferenca;
              idMaisProximo = w.id;
            }
          }
        });
      }

      carregarRoteiro(idMaisProximo);
    }

    function carregarRoteiro(idWaypointParaFocar = null) {
      const idViagem = document.getElementById('selectViagem').value;
      const container = document.getElementById('listaWaypoints');
      container.innerHTML = '';

      const waypoints = appData.waypoints
        .filter(w => w.idViagem === idViagem)
        .sort((a, b) => {
          if (!a.dataHora) return 1;
          if (!b.dataHora) return -1;
          return new Date(a.dataHora) - new Date(b.dataHora);
        });

      // Agrupa os waypoints por data/horário para aplicar a regra do orçamento inteligente
      const gruposPorHorario = {};
      waypoints.forEach(w => {
        const chave = w.dataHora ? w.dataHora : `sem_data_${Math.random()}`;
        if (!gruposPorHorario[chave]) {
          gruposPorHorario[chave] = [];
        }
        gruposPorHorario[chave].push(w);
      });

      let orcadoTotal = 0;
      let pago = 0;
      let economiaTotal = 0;

      // Cálculo financeiro inteligente
      Object.keys(gruposPorHorario).forEach(chave => {
        const itens = gruposPorHorario[chave];

        // Se houver opções no mesmo horário (carrossel), considera apenas o MAIOR valor orçado
        const maiorOrcadoDoHorario = Math.max(...itens.map(w => (w.valorOrcado !== undefined ? w.valorOrcado : (w.valorEstimado || 0))));
        orcadoTotal += maiorOrcadoDoHorario;

        itens.forEach(w => {
          const valorOrcadoItem = w.valorOrcado !== undefined ? w.valorOrcado : (w.valorEstimado || 0);
          const valorPagoItem = w.valorPago || 0;

          pago += valorPagoItem;

          // Economia somente computada para itens onde já houve pagamento preenchido
          if (valorPagoItem > 0 && valorOrcadoItem > 0) {
            const diff = valorOrcadoItem - valorPagoItem;
            if (diff > 0) {
              economiaTotal += diff;
            }
          }
        });
      });

      document.getElementById('totalOrcado').textContent = `R$ ${orcadoTotal.toFixed(2)}`;
      document.getElementById('totalPago').textContent = `R$ ${pago.toFixed(2)}`;

      const containerFalta = document.getElementById('containerFalta');
      const labelFalta = document.getElementById('labelFalta');
      const totalFalta = document.getElementById('totalFalta');

      // Validação de Excedido vs Economia
      if (pago > orcadoTotal && orcadoTotal > 0) {
        const excedido = pago - orcadoTotal;
        totalFalta.textContent = `R$ ${excedido.toFixed(2)}`;
        containerFalta.className = "bg-rose-50 p-2.5 rounded-xl transition-colors";
        labelFalta.className = "block text-[10px] font-bold text-rose-600 uppercase";
        totalFalta.className = "text-sm font-extrabold text-rose-700";
        labelFalta.textContent = "Excedido";
      } else {
        totalFalta.textContent = `R$ ${economiaTotal.toFixed(2)}`;
        containerFalta.className = "bg-emerald-50 p-2.5 rounded-xl transition-colors";
        labelFalta.className = "block text-[10px] font-bold text-emerald-600 uppercase";
        totalFalta.className = "text-sm font-extrabold text-emerald-700";
        labelFalta.textContent = "Economia";
      }

      if (waypoints.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-slate-400 font-medium text-sm">Nenhum ponto adicionado a esta viagem.</div>`;
        return;
      }

      let elementoParaFocar = null;

      Object.keys(gruposPorHorario).forEach(chave => {
        const itensDoHorario = gruposPorHorario[chave];
        const primeiroWp = itensDoHorario[0];

        const blocoDiv = document.createElement('div');
        blocoDiv.className = "space-y-2";

        if (itensDoHorario.length > 1 && primeiroWp.dataHora) {
          const headerOpcoes = document.createElement('div');
          headerOpcoes.className = "flex items-center gap-1.5 text-xs text-indigo-600 font-bold px-1";
          headerOpcoes.innerHTML = `
            <i data-lucide="clock" class="w-3.5 h-3.5"></i>
            <span>${formatarData(primeiroWp.dataHora)}</span>
          `;
          blocoDiv.appendChild(headerOpcoes);
        }

        if (itensDoHorario.length > 1) {
          const wrapperCarrossel = document.createElement('div');
          wrapperCarrossel.className = "space-y-2";

          const carrosselDiv = document.createElement('div');
          carrosselDiv.className = "flex gap-3 overflow-x-auto hide-scrollbar snap-x snap-mandatory pt-1";
          
          const carrosselId = `carrossel-${Math.random().toString(36).substr(2, 9)}`;
          carrosselDiv.id = carrosselId;

          itensDoHorario.forEach((w) => {
            const cardHtml = criarCardHTML(w, false);
            const cardWrapper = document.createElement('div');
            cardWrapper.id = `card-wp-${w.id}`;
            CardWrapper.className = "w-full transition-all duration-300";
            cardWrapper.innerHTML = cardHtml;
            carrosselDiv.appendChild(cardWrapper);

            if (w.id === idWaypointParaFocar) {
              elementoParaFocar = cardWrapper;
            }
          });

          wrapperCarrossel.appendChild(carrosselDiv);

          const dotsDiv = document.createElement('div');
          dotsDiv.className = "flex justify-center items-center gap-1.5 pb-1";
          dotsDiv.id = `dots-${carrosselId}`;

          itensDoHorario.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.className = `h-1.5 rounded-full transition-all duration-300 ${index === 0 ? 'w-4 bg-indigo-600' : 'w-1.5 bg-slate-300'}`;
            dotsDiv.appendChild(dot);
          });

          wrapperCarrossel.appendChild(dotsDiv);

          carrosselDiv.addEventListener('scroll', () => {
            const indexAtivo = Math.round(carrosselDiv.scrollLeft / carrosselDiv.clientWidth);
            const dots = dotsDiv.children;
            for (let i = 0; i < dots.length; i++) {
              if (i === indexAtivo) {
                dots[i].className = "h-1.5 rounded-full transition-all duration-300 w-4 bg-indigo-600";
              } else {
                dots[i].className = "h-1.5 rounded-full transition-all duration-300 w-1.5 bg-slate-300";
              }
            }
          });

          blocoDiv.appendChild(wrapperCarrossel);
        } else {
          const w = itensDoHorario[0];
          const cardHtml = criarCardHTML(w, true);
          const cardWrapper = document.createElement('div');
          cardWrapper.id = `card-wp-${w.id}`;
          cardWrapper.className = "transition-all duration-300";
          cardWrapper.innerHTML = cardHtml;
          blocoDiv.appendChild(cardWrapper);

          if (w.id === idWaypointParaFocar) {
            elementoParaFocar = cardWrapper;
          }
        }

        container.appendChild(blocoDiv);
      });

      lucide.createIcons();

      if (elementoParaFocar) {
        setTimeout(() => {
          elementoParaFocar.scrollIntoView({ behavior: 'smooth', block: 'center' });
          elementoParaFocar.classList.add('ring-4', 'ring-indigo-500', 'ring-offset-2', 'scale-[1.02]');
          setTimeout(() => {
            elementoParaFocar.classList.remove('ring-4', 'ring-indigo-500', 'ring-offset-2', 'scale-[1.02]');
          }, 2000);
        }, 150);
      }
    }

    function criarCardHTML(w, isUnico = false) {
      const temCidade = w.cidade && w.cidade.trim() !== "";
      const valorOrcadoItem = w.valorOrcado !== undefined ? w.valorOrcado : (w.valorEstimado || 0);

      const botaoEditarAdmin = userPin ? `
        <button onclick='abrirModalWaypoint(${JSON.stringify(w)})' class="text-slate-500 hover:text-indigo-600 p-2 rounded-xl hover:bg-slate-100 transition" title="Editar Waypoint">
          <i data-lucide="pencil" class="w-4 h-4"></i>
        </button>
      ` : '';

      const dataHoraHtml = (isUnico && w.dataHora) ? `
        <div class="flex items-center gap-1 text-[11px] text-slate-500 font-medium mt-1">
          <i data-lucide="clock" class="w-3 h-3 text-slate-400"></i>
          <span>${formatarData(w.dataHora)}</span>
        </div>
      ` : '';

      const botaoPagamentoHtml = !modoLeituraForcado ? `
        <button onclick="abrirModalPagamento('${w.id}', ${w.valorPago})" class="bg-blue-50 text-blue-700 font-bold px-3 py-1.5 rounded-xl border border-blue-200 hover:bg-blue-100 active:scale-95 transition">
          Registrar Pagamento
        </button>
      ` : '';

      return `
        <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200 relative h-full flex flex-col justify-between">
          <div>
            ${w.linkFoto ? `<img src="${w.linkFoto}" class="w-full h-36 object-cover" onerror="this.style.display='none'">` : ''}
            <div class="p-4 space-y-2">
              <div class="flex justify-between items-start gap-2">
                <div class="min-w-0 flex-1">
                  <h3 class="font-bold text-slate-900 text-base leading-snug break-words">${w.atividade}</h3>
                  <div class="mt-1">
                    <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full uppercase tracking-wider">${w.cidade || 'Atividade Geral'}</span>
                  </div>
                  ${dataHoraHtml}
                </div>
                <div class="flex items-center gap-1 flex-shrink-0">
                  ${temCidade ? `
                    <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${w.atividade}, ${w.cidade}`)}" target="_blank" class="bg-indigo-50 text-indigo-600 p-2.5 rounded-xl hover:bg-indigo-100 transition" title="Abrir no Maps">
                      <i data-lucide="map-pin" class="w-5 h-5"></i>
                    </a>
                  ` : ''}
                  ${botaoEditarAdmin}
                </div>
              </div>

              ${w.observacoes ? `<p class="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-xl border border-slate-100">${w.observacoes}</p>` : ''}
            </div>
          </div>

          <div class="px-4 pb-4 pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
            <div>
              <span class="text-slate-400 block text-[10px]">Orçado / Pago</span>
              <span class="font-bold text-slate-700">R$ ${valorOrcadoItem.toFixed(2)}</span> / 
              <span class="font-extrabold ${w.valorPago >= valorOrcadoItem && valorOrcadoItem > 0 ? 'text-blue-600' : 'text-slate-800'}">R$ ${w.valorPago.toFixed(2)}</span>
            </div>
            
            <div class="flex items-center gap-2">
              ${w.linkMidia ? `<a href="${w.linkMidia}" target="_blank" class="text-rose-500 bg-rose-50 p-2 rounded-xl" title="Ver Vídeo"><i data-lucide="video" class="w-4 h-4"></i></a>` : ''}
              ${botaoPagamentoHtml}
            </div>
          </div>
        </div>
      `;
    }

    function formatarData(dataStr) {
      if (!dataStr) return '';
      const data = new Date(dataStr);
      if (isNaN(data.getTime())) return dataStr;

      const dataCorrigida = new Date(data.getTime() - (3 * 60 * 60 * 1000));

      const dia = String(dataCorrigida.getUTCDate()).padStart(2, '0');
      const mes = String(dataCorrigida.getUTCMonth() + 1).padStart(2, '0');
      const ano = dataCorrigida.getUTCFullYear();
      
      const hora = String(dataCorrigida.getUTCHours()).padStart(2, '0');
      const min = String(dataCorrigida.getUTCMinutes()).padStart(2, '0');

      return `${dia}/${mes}/${ano} às ${hora}:${min}`;
    }

    function toggleModoEdicao() {
      if (userPin) {
        userPin = null;
        localStorage.removeItem('itigo_pin');
        localStorage.removeItem('itigo_timestamp');
        
        document.getElementById('iconLock').setAttribute('data-lucide', 'lock');
        document.getElementById('btnNovaViagem').classList.add('hidden');
        document.getElementById('btnAddWaypoint').classList.add('hidden');
        carregarRoteiroComFocoAutomatico();
        lucide.createIcons();
        alert("Modo de edição encerrado com sucesso.");
      } else {
        abrirModalPin();
      }
    }

    function abrirModalPin() { document.getElementById('modalPin').classList.remove('hidden'); }
    function fecharModalPin() { document.getElementById('modalPin').classList.add('hidden'); }

    async function confirmarPin() {
      const pin = document.getElementById('inputPin').value;
      const res = await API({ action: 'validarPin', pin: pin });
      
      if (res.sucesso) {
        userPin = pin;
        localStorage.setItem('itigo_pin', pin);
        localStorage.setItem('itigo_timestamp', new Date().getTime().toString());

        ativarModoEdicaoVisual();
        fecharModalPin();
        document.getElementById('inputPin').value = '';
      } else {
        alert("PIN Incorreto!");
      }
    }

    function ativarModoEdicaoVisual() {
      document.getElementById('iconLock').setAttribute('data-lucide', 'unlock');
      document.getElementById('btnNovaViagem').classList.remove('hidden');
      document.getElementById('btnAddWaypoint').classList.remove('hidden');
      carregarRoteiroComFocoAutomatico();
      lucide.createIcons();
    }

    function abrirModalViagem() { document.getElementById('modalViagem').classList.remove('hidden'); }
    function fecharModalViagem() { document.getElementById('modalViagem').classList.add('hidden'); }

    async function salvarViagem() {
      const nome = document.getElementById('inputNomeViagem').value;
      if(!nome) return;

      fecharModalViagem();
      mostrarLoading("Criando viagem...");

      try {
        const res = await API({ action: 'criarViagem', nomeViagem: nome });
        if (res.sucesso) {
          document.getElementById('inputNomeViagem').value = '';
          await carregarDados();
          document.getElementById('selectViagem').value = res.id;
          carregarRoteiroComFocoAutomatico();
        }
      } finally {
        esconderLoading();
      }
    }

    async function carregarDados() {
      try {
        const res = await API({ action: 'getDados' });
        if (res.sucesso) {
          appData = res;
          renderizarSeletorViagem();
        }
      } catch(e) {
        alert("Erro ao conectar com a planilha. Verifique a URL do Script.");
      }
    }

    function abrirModalWaypoint(wp = null) { 
      const btnExcluir = document.getElementById('btnExcluirModal');

      if (wp && typeof wp === 'object') {
        document.getElementById('tituloModalWp').textContent = 'Editar Waypoint';
        btnExcluir.classList.remove('hidden');
        
        document.getElementById('wpId').value = wp.id || '';
        document.getElementById('wpAtividade').value = wp.atividade || '';
        document.getElementById('wpCidade').value = wp.cidade || '';
        
        if (wp.dataHora) {
          const data = new Date(wp.dataHora);
          if (!isNaN(data.getTime())) {
            const dataCorrigida = new Date(data.getTime() - (3 * 60 * 60 * 1000));
            
            const ano = dataCorrigida.getUTCFullYear();
            const mes = String(dataCorrigida.getUTCMonth() + 1).padStart(2, '0');
            const dia = String(dataCorrigida.getUTCDate()).padStart(2, '0');
            const hora = String(dataCorrigida.getUTCHours()).padStart(2, '0');
            const min = String(dataCorrigida.getUTCMinutes()).padStart(2, '0');

            document.getElementById('wpData').value = `${ano}-${mes}-${dia}`;
            document.getElementById('wpHora').value = `${hora}:${min}`;
          } else {
            document.getElementById('wpData').value = '';
            document.getElementById('wpHora').value = '';
          }
        } else {
          document.getElementById('wpData').value = '';
          document.getElementById('wpHora').value = '';
        }

        const valorOrcadoObj = wp.valorOrcado !== undefined ? wp.valorOrcado : (wp.valorEstimado || '');
        document.getElementById('wpValorOrcado').value = valorOrcadoObj;
        document.getElementById('wpValorPago').value = wp.valorPago || '';
        document.getElementById('wpLinkFoto').value = wp.linkFoto || '';
        document.getElementById('wpLinkMidia').value = wp.linkMidia || '';
        document.getElementById('wpObservacoes').value = wp.observacoes || '';
      } else {
        document.getElementById('tituloModalWp').textContent = 'Novo Waypoint';
        btnExcluir.classList.add('hidden');

        document.getElementById('wpId').value = '';
        document.getElementById('wpAtividade').value = '';
        document.getElementById('wpCidade').value = '';
        document.getElementById('wpData').value = '';
        document.getElementById('wpHora').value = '';
        document.getElementById('wpValorOrcado').value = '';
        document.getElementById('wpValorPago').value = '';
        document.getElementById('wpLinkFoto').value = '';
        document.getElementById('wpLinkMidia').value = '';
        document.getElementById('wpObservacoes').value = '';
      }
      
      atualizarPreviews();
      document.getElementById('modalWaypoint').classList.remove('hidden'); 
      lucide.createIcons();
    }
    
    function fecharModalWaypoint() { document.getElementById('modalWaypoint').classList.add('hidden'); }

    function atualizarPreviews() {
      atualizarPreviewMaps();
      atualizarPreviewFoto();
    }

    function atualizarPreviewMaps() {
      const atividade = document.getElementById('wpAtividade').value.trim();
      const cidade = document.getElementById('wpCidade').value.trim();
      const box = document.getElementById('boxPreviewMaps');
      const iframe = document.getElementById('iframeMapsPreview');
      const btnTestar = document.getElementById('btnTestarMaps');

      if (cidade !== "") {
        const termoBusca = encodeURIComponent(`${atividade}, ${cidade}`);
        const urlEmbed = `https://maps.google.com/maps?q=${termoBusca}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
        const urlMaps = `https://www.google.com/maps/search/?api=1&query=${termoBusca}`;

        if (iframe.src !== urlEmbed) {
          iframe.src = urlEmbed;
        }
        btnTestar.href = urlMaps;
        box.classList.remove('hidden');
      } else {
        box.classList.add('hidden');
        iframe.src = '';
      }
    }

    function atualizarPreviewFoto() {
      const atividade = document.getElementById('wpAtividade').value.trim();
      const cidade = document.getElementById('wpCidade').value.trim();
      const linkFoto = document.getElementById('wpLinkFoto').value.trim();
      const boxFoto = document.getElementById('boxPreviewFoto');
      const imgPreview = document.getElementById('imgPreview');
      const erroFoto = document.getElementById('erroFoto');
      const btnPesquisarImagens = document.getElementById('btnPesquisarImagens');

      const termoBuscaImg = encodeURIComponent(`${atividade} ${cidade} turismo`.trim());
      btnPesquisarImagens.href = `https://www.google.com/search?q=${termoBuscaImg}&tbm=isch`;

      if (linkFoto) {
        erroFoto.classList.add('hidden');
        imgPreview.src = linkFoto;
        boxFoto.classList.remove('hidden');
      } else {
        boxFoto.classList.add('hidden');
        imgPreview.src = '';
      }
    }

    async function salvarWaypoint() {
      const idViagem = document.getElementById('selectViagem').value;
      const selectViagemEl = document.getElementById('selectViagem');
      const nomeViagem = selectViagemEl.options[selectViagemEl.selectedIndex] ? selectViagemEl.options[selectViagemEl.selectedIndex].text : '';

      const dataVal = document.getElementById('wpData').value;
      const horaVal = document.getElementById('wpHora').value;
      let dataHoraCombinada = '';
      if (dataVal) {
        dataHoraCombinada = dataVal + (horaVal ? `T${horaVal}` : 'T00:00');
      }

      const wpIdInput = document.getElementById('wpId').value;
      const valorOrcadoInput = parseFloat(document.getElementById('wpValorOrcado').value) || 0;
      
      const wp = {
        id: wpIdInput,
        idViagem: idViagem,
        nomeViagem: nomeViagem,
        atividade: document.getElementById('wpAtividade').value,
        cidade: document.getElementById('wpCidade').value,
        dataHora: dataHoraCombinada,
        valorOrcado: valorOrcadoInput,
        valorEstimado: valorOrcadoInput,
        valorPago: parseFloat(document.getElementById('wpValorPago').value) || 0,
        linkFoto: document.getElementById('wpLinkFoto').value,
        linkMidia: document.getElementById('wpLinkMidia').value,
        observacoes: document.getElementById('wpObservacoes').value
      };

      fecharModalWaypoint();
      const acaoTexto = wp.id ? "Atualizando..." : "Salvando waypoint...";
      mostrarLoading(acaoTexto);

      try {
        const res = await API({ action: 'salvarWaypoint', waypoint: wp });
        if(res.sucesso) {
          await carregarDados();
          const idFoco = wp.id || res.id;
          carregarRoteiro(idFoco);
        }
      } finally {
        esconderLoading();
      }
    }

    async function excluirWaypointDoModal() {
      const idWaypoint = document.getElementById('wpId').value;
      if (!idWaypoint) return;

      if (!confirm("Tem certeza que deseja excluir este waypoint?")) return;
      
      fecharModalWaypoint();
      mostrarLoading("Excluindo...");
      try {
        const res = await API({ action: 'excluirWaypoint', idWaypoint: idWaypoint });
        if (res.sucesso) {
          await carregarDados();
          carregarRoteiro();
        } else {
          alert(res.mensagem || "Erro ao excluir waypoint.");
        }
      } finally {
        esconderLoading();
      }
    }

    function abrirModalPagamento(id, valorAtual) {
      document.getElementById('pagWpId').value = id;
      document.getElementById('pagValorInput').value = valorAtual;
      document.getElementById('modalPagamento').classList.remove('hidden');
    }
    function fecharModalPagamento() { document.getElementById('modalPagamento').classList.add('hidden'); }

    async function confirmarPagamentoRapido() {
      const realId = document.getElementById('pagWpId').value;
      const val = parseFloat(document.getElementById('pagValorInput').value) || 0;

      fecharModalPagamento();
      mostrarLoading("Registrando pagamento...");

      try {
        const res = await API({ action: 'atualizarPagamento', idWaypoint: realId, valorPago: val, statusPago: 'Sim' });
        if(res.sucesso) {
          await carregarDados();
          carregarRoteiro(realId);
        }
      } finally {
        esconderLoading();
      }
    }
  </script>
</body>
</html>
